name: Build RPM package for openSUSE Tumbleweed

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  rpm-build:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          zypper ar -G https://download.opensuse.org/repositories/home:/pvarkoly:/CRANIX/openSUSE_Tumbleweed/ CRANIX
          zypper --non-interactive refresh
          zypper --non-interactive install -y \
            python3 python3-devel python3-setuptools python3-wheel python3-pip \
            python3-build python3-requests python3-bashconfigparser \
            rpm-build rsync gzip tar

      - name: Build Python wheel and sdist
        run: |
          python3 -m build
          ls -l dist

      - name: Prepare source tarball for RPM build
        run: |
          VERSION=$(tr -d '\n' < VERSION)
          NAME="cranix-python"
          SRC_DIR="/tmp/${NAME}-${VERSION}"
          rm -rf "${SRC_DIR}"
          mkdir -p "${SRC_DIR}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='*.egg-info' \
            --exclude='.pytest_cache' \
            ./ "${SRC_DIR}/"
          tar -C /tmp -czf "/tmp/${NAME}-${VERSION}.tar.gz" "${NAME}-${VERSION}"
          ls -l "/tmp/${NAME}-${VERSION}.tar.gz"

      - name: Create RPM spec
        run: |
          NAME="cranix-python"
          VERSION=$(tr -d '\n' < VERSION)
          sed s/##VERSION##/${VERSION}/ ${NAME}.spec > /tmp/${NAME}.spec

      - name: Build RPM
        run: |
          mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          VERSION=$(tr -d '\n' < VERSION)
          cp "/tmp/${NAME}-${VERSION}.tar.gz" /usr/src/packages/SOURCES/
          cp /tmp/${NAME}.spec /usr/src/packages/SPECS/
          rpmbuild -ba /usr/src/packages/SPECS/${NAME}.spec

      - name: Upload RPM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cranix-rpm-opensuse-tumbleweed
          path: /usr/src/packages/RPMS/noarch/*.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Upload RPM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: /usr/src/packages/RPMS/noarch/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
